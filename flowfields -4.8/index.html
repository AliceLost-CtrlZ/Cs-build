<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowfields — Generative Art Studio</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#16181f; --panel-2:#1e212b; --line:#2a2e3a;
    --ink:#e8eaf0; --muted:#8b91a3; --accent:#7dd3fc; --accent-2:#c4b5fd;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; overflow:hidden;
  }
  #stage{flex:1; position:relative; display:grid; place-items:center; min-width:0}
  canvas{
    background:#000; box-shadow:0 20px 60px rgba(0,0,0,.6);
    max-width:100%; max-height:100%; border-radius:6px;
  }
  aside{
    width:300px; flex:none; background:var(--panel);
    border-left:1px solid var(--line); display:flex; flex-direction:column;
    height:100%;
  }
  header{padding:18px 18px 14px; border-bottom:1px solid var(--line)}
  h1{margin:0; font-size:16px; letter-spacing:.02em; font-weight:650}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted); font-size:12px; margin-top:2px}
  .scroll{overflow:auto; padding:14px 18px 20px; flex:1}
  .group{margin-bottom:18px}
  .group h2{
    font-size:11px; text-transform:uppercase; letter-spacing:.12em;
    color:var(--muted); margin:0 0 10px; font-weight:600;
  }
  label{display:block; margin-bottom:12px}
  .row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px}
  .row b{font-weight:500}
  .val{color:var(--accent); font-variant-numeric:tabular-nums; font-size:12px}
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:4px;
    background:var(--panel-2); border-radius:3px; outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:15px; height:15px; border-radius:50%;
    background:var(--accent); border:2px solid var(--bg); cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:15px; height:15px; border-radius:50%; background:var(--accent);
    border:2px solid var(--bg); cursor:pointer;
  }
  .palettes{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
  .pal{
    border:1px solid var(--line); border-radius:8px; padding:6px; cursor:pointer;
    background:var(--panel-2); transition:border-color .15s;
  }
  .pal:hover{border-color:var(--accent)}
  .pal.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
  .pal .name{font-size:11px; color:var(--muted); margin-bottom:5px}
  .swatch{display:flex; height:14px; border-radius:4px; overflow:hidden}
  .swatch i{flex:1}
  .btns{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  button{
    font:inherit; color:var(--ink); background:var(--panel-2);
    border:1px solid var(--line); border-radius:8px; padding:9px 10px;
    cursor:pointer; transition:background .15s,border-color .15s;
  }
  button:hover{background:#262a36; border-color:var(--accent)}
  button.primary{background:var(--accent); color:#08131c; border-color:var(--accent); font-weight:600}
  button.primary:hover{filter:brightness(1.08)}
  button.wide{grid-column:1 / -1}
  .hint{color:var(--muted); font-size:11px; margin-top:14px; line-height:1.6}
  kbd{background:var(--panel-2); border:1px solid var(--line); border-radius:4px; padding:1px 5px; font-size:11px}
  .seg{display:flex; gap:6px}
  .seg button{flex:1; padding:7px}
  .seg button.on{background:var(--accent); color:#08131c; border-color:var(--accent); font-weight:600}
  @media (max-width:720px){
    body{flex-direction:column}
    aside{width:100%; height:auto; border-left:none; border-top:1px solid var(--line)}
    #stage{height:52vh}
    .scroll{max-height:40vh}
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="c"></canvas></div>
  <aside>
    <header>
      <h1>Flow<span>fields</span></h1>
      <div class="sub">Generative art from a living vector field</div>
    </header>
    <div class="scroll">
      <div class="group">
        <h2>Motion</h2>
        <label>
          <div class="row"><b>Particles</b><span class="val" id="v-count">900</span></div>
          <input type="range" id="count" min="100" max="3000" step="50" value="900">
        </label>
        <label>
          <div class="row"><b>Field scale</b><span class="val" id="v-scale">100</span></div>
          <input type="range" id="scale" min="20" max="260" step="5" value="100">
        </label>
        <label>
          <div class="row"><b>Speed</b><span class="val" id="v-speed">1.4</span></div>
          <input type="range" id="speed" min="0.2" max="4" step="0.1" value="1.4">
        </label>
        <label>
          <div class="row"><b>Curl / turbulence</b><span class="val" id="v-curl">1.0</span></div>
          <input type="range" id="curl" min="0" max="3" step="0.1" value="1.0">
        </label>
      </div>

      <div class="group">
        <h2>Ink</h2>
        <label>
          <div class="row"><b>Line weight</b><span class="val" id="v-weight">1.2</span></div>
          <input type="range" id="weight" min="0.3" max="4" step="0.1" value="1.2">
        </label>
        <label>
          <div class="row"><b>Opacity</b><span class="val" id="v-alpha">18</span></div>
          <input type="range" id="alpha" min="2" max="90" step="1" value="18">
        </label>
        <label>
          <div class="row"><b>Fade / trail</b><span class="val" id="v-fade">0</span></div>
          <input type="range" id="fade" min="0" max="30" step="1" value="0">
        </label>
      </div>

      <div class="group">
        <h2>Palette</h2>
        <div class="palettes" id="palettes"></div>
      </div>

      <div class="group">
        <h2>Background</h2>
        <div class="seg" id="bgseg">
          <button data-bg="dark" class="on">Dark</button>
          <button data-bg="light">Light</button>
          <button data-bg="ink">Ink</button>
        </div>
      </div>

      <div class="group">
        <h2>Actions</h2>
        <div class="btns">
          <button id="regen">↻ New seed</button>
          <button id="pause">⏸ Pause</button>
          <button class="primary wide" id="save">⤓ Save PNG</button>
        </div>
        <div class="hint">
          <b style="color:var(--ink)">Shortcuts:</b><br>
          <kbd>Space</kbd> pause · <kbd>R</kbd> new seed · <kbd>S</kbd> save · <kbd>C</kbd> clear<br>
          Drag on the canvas to push the flow around.
        </div>
      </div>
    </div>
  </aside>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha:false });
  const stage = document.getElementById('stage');

  // ---- Palettes ----
  const PALETTES = {
    "Aurora":   ["#7dd3fc","#a5b4fc","#c4b5fd","#f0abfc","#5eead4"],
    "Ember":    ["#fca5a5","#fdba74","#fcd34d","#fb7185","#f59e0b"],
    "Botanic":  ["#86efac","#4ade80","#a3e635","#34d399","#fde68a"],
    "Mono":     ["#f8fafc","#cbd5e1","#94a3b8","#e2e8f0","#64748b"],
    "Sunset":   ["#f43f5e","#fb7185","#fbbf24","#a855f7","#f97316"],
    "Ocean":    ["#22d3ee","#38bdf8","#818cf8","#2dd4bf","#60a5fa"],
  };
  const BG = { dark:"#0a0b0f", light:"#f4f2ec", ink:"#101826" };

  // ---- State ----
  const S = {
    count:900, scale:100, speed:1.4, curl:1.0,
    weight:1.2, alpha:18, fade:0,
    palette:"Aurora", bg:"dark", paused:false, seed: Math.random()*1e5,
  };

  let W=0, H=0, particles=[], t=0;
  const mouse = { x:0, y:0, active:false };

  // ---- Value-noise field (seeded, no deps) ----
  let perm = new Uint8Array(512);
  function buildPerm(seed){
    const p = new Uint8Array(256);
    for(let i=0;i<256;i++) p[i]=i;
    // seeded shuffle
    let s = (seed*2654435761) >>> 0;
    const rnd = () => (s = (s*1664525 + 1013904223) >>> 0) / 4294967296;
    for(let i=255;i>0;i--){ const j = (rnd()*(i+1))|0; [p[i],p[j]]=[p[j],p[i]]; }
    for(let i=0;i<512;i++) perm[i]=p[i&255];
  }
  const fade = t => t*t*t*(t*(t*6-15)+10);
  const lerp = (a,b,t) => a+(b-a)*t;
  function grad(h,x,y){ const u = (h&1)?x:-x, v=(h&2)?y:-y; return u+v; }
  function noise2(x,y){
    const X=Math.floor(x)&255, Y=Math.floor(y)&255;
    x-=Math.floor(x); y-=Math.floor(y);
    const u=fade(x), v=fade(y);
    const aa=perm[perm[X]+Y], ab=perm[perm[X]+Y+1];
    const ba=perm[perm[X+1]+Y], bb=perm[perm[X+1]+Y+1];
    return lerp(
      lerp(grad(aa,x,y),   grad(ba,x-1,y),   u),
      lerp(grad(ab,x,y-1), grad(bb,x-1,y-1), u), v);
  }

  // ---- Particles ----
  function makeParticle(){
    const cols = PALETTES[S.palette];
    return {
      x: Math.random()*W, y: Math.random()*H,
      life: 40 + Math.random()*160,
      color: cols[(Math.random()*cols.length)|0],
      px:0, py:0, init:true,
    };
  }
  function reset(){
    particles = Array.from({length:S.count}, makeParticle);
  }

  function resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const rect = stage.getBoundingClientRect();
    W = Math.max(320, Math.floor(rect.width  - 24));
    H = Math.max(320, Math.floor(rect.height - 24));
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    canvas.width = W*dpr; canvas.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    clear();
  }

  function clear(){
    ctx.fillStyle = BG[S.bg];
    ctx.fillRect(0,0,W,H);
  }

  function angleAt(x,y){
    const f = 1/S.scale;
    let n = noise2(x*f + S.seed, y*f + S.seed*0.7);
    // add a second octave for turbulence
    n += 0.5*noise2(x*f*2.3 + 100, y*f*2.3 + 100) * S.curl;
    let a = n * Math.PI * 2.2;
    // mouse push
    if(mouse.active){
      const dx=x-mouse.x, dy=y-mouse.y, d2=dx*dx+dy*dy;
      if(d2 < 22000){ a += Math.atan2(dy,dx)*0.9*(1 - d2/22000); }
    }
    return a;
  }

  function step(){
    if(S.fade>0){
      ctx.fillStyle = BG[S.bg];
      ctx.globalAlpha = S.fade/100;
      ctx.fillRect(0,0,W,H);
      ctx.globalAlpha = 1;
    }
    ctx.lineWidth = S.weight;
    ctx.lineCap = 'round';
    const spd = S.speed;

    for(const p of particles){
      const a = angleAt(p.x, p.y);
      p.px = p.x; p.py = p.y;
      p.x += Math.cos(a)*spd;
      p.y += Math.sin(a)*spd;
      p.life--;

      if(!p.init){
        ctx.strokeStyle = hexAlpha(p.color, S.alpha/100);
        ctx.beginPath();
        ctx.moveTo(p.px, p.py);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }
      p.init = false;

      if(p.life<=0 || p.x<0||p.x>W||p.y<0||p.y>H){
        Object.assign(p, makeParticle());
      }
    }
    t++;
  }

  function hexAlpha(hex, a){
    const n = parseInt(hex.slice(1),16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
  }

  function loop(){
    if(!S.paused) step();
    requestAnimationFrame(loop);
  }

  function regenerate(hard){
    if(hard){ S.seed = Math.random()*1e5; buildPerm(S.seed); }
    clear(); reset();
  }

  // ---- UI wiring ----
  const bind = (id, key, fmt, after) => {
    const el = document.getElementById(id);
    const out = document.getElementById('v-'+id);
    const upd = () => {
      const v = parseFloat(el.value);
      S[key] = v; out.textContent = fmt ? fmt(v) : v;
      if(after) after(v);
    };
    el.addEventListener('input', upd); upd();
  };
  bind('count','count', v=>v, () => reset());
  bind('scale','scale');
  bind('speed','speed', v=>v.toFixed(1));
  bind('curl','curl', v=>v.toFixed(1));
  bind('weight','weight', v=>v.toFixed(1));
  bind('alpha','alpha');
  bind('fade','fade');

  // palettes
  const palWrap = document.getElementById('palettes');
  Object.entries(PALETTES).forEach(([name,cols]) => {
    const d = document.createElement('div');
    d.className = 'pal' + (name===S.palette?' active':'');
    d.innerHTML = `<div class="name">${name}</div><div class="swatch">${
      cols.map(c=>`<i style="background:${c}"></i>`).join('')}</div>`;
    d.onclick = () => {
      S.palette = name;
      palWrap.querySelectorAll('.pal').forEach(x=>x.classList.remove('active'));
      d.classList.add('active');
      for(const p of particles) p.color = cols[(Math.random()*cols.length)|0];
    };
    palWrap.appendChild(d);
  });

  // background
  document.getElementById('bgseg').addEventListener('click', e => {
    const b = e.target.dataset.bg; if(!b) return;
    S.bg = b;
    [...e.currentTarget.children].forEach(x=>x.classList.toggle('on', x===e.target));
    clear();
  });

  // buttons
  const pauseBtn = document.getElementById('pause');
  document.getElementById('regen').onclick = () => regenerate(true);
  document.getElementById('save').onclick = savePNG;
  pauseBtn.onclick = togglePause;
  function togglePause(){
    S.paused = !S.paused;
    pauseBtn.textContent = S.paused ? '▶ Resume' : '⏸ Pause';
  }
  function savePNG(){
    const a = document.createElement('a');
    a.download = `flowfield-${Date.now()}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  // mouse interaction
  const toLocal = e => {
    const r = canvas.getBoundingClientRect();
    const p = (e.touches ? e.touches[0] : e);
    mouse.x = p.clientX - r.left; mouse.y = p.clientY - r.top;
  };
  canvas.addEventListener('pointerdown', e => { mouse.active=true; toLocal(e); });
  canvas.addEventListener('pointermove', e => { if(mouse.active) toLocal(e); });
  window.addEventListener('pointerup', () => mouse.active=false);

  // keyboard
  window.addEventListener('keydown', e => {
    if(e.target.tagName==='INPUT') return;
    const k = e.key.toLowerCase();
    if(k===' '){ e.preventDefault(); togglePause(); }
    else if(k==='r') regenerate(true);
    else if(k==='s') savePNG();
    else if(k==='c') clear();
  });

  window.addEventListener('resize', resize);

  // ---- Boot ----
  buildPerm(S.seed);
  resize();
  reset();
  loop();
})();
</script>
</body>
</html>
